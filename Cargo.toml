[package]
name = "tat_agent"
version = "1.1.11"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = [
  "test-util",
  "rt-multi-thread",
  "process",
  "macros",
] }
# WARNING: Do NOT use the default rustls crypto backend (aws-lc-rs).
# aws-lc-rs calls RNDGETENTCNT to check /dev/urandom entropy and enters an
# infinite 250ms polling loop when entropy_avail < 256 (see urandom.c in
# aws-lc-sys). This causes a permanent deadlock on KVM guests with old kernels
# (< 5.6) that lack a hardware RNG (virtio-rng).
reqwest = { version = "0.13.2", default-features = false, features = [
  "native-tls-vendored",
  "stream",
] }
tokio-stream = { version = "0.1.18", features = ["fs"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
bytes = "1.11.1"
futures = { version = "0.3.32", default-features = false, features = [
  "std",
  "async-await",
] }
serde_json = "1.0.149"
serde_bytes = "0.11.19"
serde = { version = "1.0.228", features = ["derive"] }
url = "2.5.8"
clap = { version = "4.5.60", features = ["derive"] }
log = "0.4.29"
log4rs = { version = "1.4.0", default-features = false, features = [
  "all_components",
] }
libc = "0.2.182"
rand = "0.8.5"
base64 = "0.22.1"
chrono = "0.4.44"
md5 = "0.8.0"
zip = "8.1.0"
cfg-if = "1.0.4"
urlencoding = "2.1.3"
bson = "2.13.0"
glob = "0.3.3"
rsa = "0.9.10"
hmac = "0.12.1"
sha1 = { version = "0.10.6", default-features = false, features = ["oid"] }
anyhow = "1.0.102"
leaky-bucket = "1.1.2"
sysinfo = { version = "0.38.2", default-features = false, features = [
  "system",
] }
machine-uid = "0.5.4"
smbios-lib = "0.9.2"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5.0"
uzers = { version = "0.12.2" }
procfs = "0.18.0"
unix_mode = "0.1.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
  "std",
  "winsvc",
  "winbase",
  "winnt",
  "stringapiset",
  "synchapi",
  "namedpipeapi",
  "lmaccess",
  "lmapibuf",
  "sddl",
  "ntlsa",
  "ntsecapi",
  "lsalookup",
  "libloaderapi",
  "errhandlingapi",
  "securitybaseapi",
  "userenv",
  "tlhelp32",
  "memoryapi",
  "subauth",
  "winsock2",
  "winreg",
] }
codepage-strings = "1.0.2"
ntapi = "0.4.3"
nom = "7.1.1"

[build-dependencies]
reqwest = { version = "0.13.2", default-features = false, features = [
  "native-tls-vendored",
  "blocking",
] }
